version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gaming_sim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gaming_simulation
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gaming_sim_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gaming_sim_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/gaming_simulation?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: simulated_jwt_secret_production_key_32bytes_min!
      JWT_REFRESH_SECRET: simulated_refresh_secret_production_key_32bytes!
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gaming_sim_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    networks:
      - internal_network
    ports:
      - "3000:3000"

  fraud:
    build:
      context: ./fraud
      dockerfile: Dockerfile
    container_name: gaming_sim_fraud
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/gaming_simulation?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:

